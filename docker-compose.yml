services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: clinora
      POSTGRES_PASSWORD: clinora
      POSTGRES_DB: clinora
    ports:
      - "5432:5432"
    volumes:
      - clinora_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend/private_uploads:/app/private_uploads

volumes:
  clinora_pgdata: